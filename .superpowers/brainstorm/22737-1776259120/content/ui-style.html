<h2>UI 交互方式</h2>
<p class="subtitle">确定 App 主要用什么方式交互和展示</p>

<div class="options">
  <div class="option" data-choice="single-window" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>单窗口应用</h3>
      <p>类似 macOS 普通应用，打开就是一个主窗口，显示技能列表和操作</p>
      <p>最简单直接，符合极简要求</p>
    </div>
  </div>

  <div class="option" data-choice="menu-bar" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>状态栏 Menu Bar 应用</h3>
      <p>只在顶部菜单栏显示图标，点击弹出面板操作</p>
      <p>更轻量不占 Dock，需要时才打开，适合工具类应用</p>
    </div>
  </div>
</div>

<p class="subtitle">你更倾向哪种交互方式？</p>
